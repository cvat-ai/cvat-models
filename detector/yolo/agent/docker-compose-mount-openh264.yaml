services:
  cvat-agent:
    volumes:
      - type: bind
        source: ${OPENH264_LIBRARY_ABSOLUTE_PATH:?Set OPENH264_LIBRARY_ABSOLUTE_PATH to the path of the OpenH264 library file}
        target: /opt/openh264/libopenh264.so
        read_only: true
        bind:
          create_host_path: false
    environment:
      CVAT_OPENH264_LIBRARY: /opt/openh264/libopenh264.so
  cvat-agent-gpu:
    volumes:
      - type: bind
        source: ${OPENH264_LIBRARY_ABSOLUTE_PATH:?Set OPENH264_LIBRARY_ABSOLUTE_PATH to the path of the OpenH264 library file}
        target: /opt/openh264/libopenh264.so
        read_only: true
        bind:
          create_host_path: false
    environment:
      CVAT_OPENH264_LIBRARY: /opt/openh264/libopenh264.so
