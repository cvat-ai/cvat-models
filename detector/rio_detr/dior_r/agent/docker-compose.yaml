services:
  cvat-function-register:
    image: ${IMAGE_URL}
    entrypoint: ["/app/function_registration.sh"]
    volumes:
      - shared-data:/shared
      - model-cache:/app/rio_detr/checkpoints
      - upstream-cache:/home/agent/.cache/cvat-models/rio-detr
    restart: "on-failure"
    environment:
      CVAT_BASE_URL:
      CVAT_ACCESS_TOKEN:
      MODEL_CONFIG_PARAMS:
      ORG_SLUG:
      FUNCTION_NAME:
      FUNCTION_VISIBILITY:

  cvat-agent:
    image: ${IMAGE_URL}
    profiles: [cpu]
    volumes:
      - shared-data:/shared:ro
      - model-cache:/app/rio_detr/checkpoints:ro
      - upstream-cache:/home/agent/.cache/cvat-models/rio-detr:ro
    depends_on:
      cvat-function-register:
        condition: service_completed_successfully
    deploy:
      replicas: ${AGENTS_COUNT:-1}
    environment:
      CVAT_BASE_URL:
      CVAT_ACCESS_TOKEN:
      MODEL_CONFIG_PARAMS:
      ORG_SLUG:
      USE_CUDA: "false"

  cvat-agent-gpu:
    extends: cvat-agent
    profiles: !override [gpu]
    deploy:
      replicas: ${AGENTS_COUNT:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      USE_CUDA: "true"

  cvat-function-deregister:
    image: ${IMAGE_URL}
    entrypoint: ["/app/function_deregistration.sh"]
    volumes:
      - shared-data:/shared:ro
    profiles: [manual]
    environment:
      CVAT_BASE_URL:
      CVAT_ACCESS_TOKEN:
      ORG_SLUG:

volumes:
  shared-data:
  model-cache:
  upstream-cache:
